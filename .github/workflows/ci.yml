name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0

      - run: pnpm verify
      - run: pnpm api:report
      - run: |
          if [ -n "$(git status --porcelain etc/api-report.md)" ]; then
            git diff etc/api-report.md
            echo "::error::Public API changes detected that are not committed in etc/api-report.md. Run 'pnpm api:report' and commit the changes."
            exit 1
          fi
      - run: pnpm build
      - run: pnpm docs:build
