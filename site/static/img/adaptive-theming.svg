<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How StageRoutine Derives Palette Colors from 3 Inputs" viewBox="0 0 780 260" width="100%">
  <title>Automatic Palette Derivation</title>

  <defs>
    <marker id="derive-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Outer Canvas Container -->
  <rect x="10" y="10" width="760" height="240" rx="10" fill="rgba(56, 189, 248, 0.02)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />
  <text x="30" y="38" fill="#ffffff" font-size="15" font-weight="700" font-family="system-ui, sans-serif">Automatic Palette Derivation</text>
  <text x="245" y="38" fill="#a1a1aa" font-size="13" font-weight="500" font-family="system-ui, sans-serif">— You pick 3 colors; the framework derives the rest</text>

  <!-- Input Box (Top Centered) -->
  <g transform="translate(150, 55)">
    <rect x="0" y="0" width="480" height="48" rx="6" fill="rgba(56, 189, 248, 0.08)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="240" y="20" fill="#38bdf8" font-size="12" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">YOUR INPUT (3 COLORS)</text>
    <text x="240" y="38" fill="#ffffff" font-size="14" font-weight="600" font-family="JetBrains Mono, monospace" text-anchor="middle">stage.theme({ background, text, primary })</text>
  </g>

  <!-- Branching Connector Lines -->
  <line x1="390" y1="103" x2="390" y2="118" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="140" y1="118" x2="640" y2="118" stroke="#38bdf8" stroke-width="1.5" />

  <line x1="140" y1="118" x2="140" y2="132" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#derive-arrow)" />
  <line x1="390" y1="118" x2="390" y2="132" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#derive-arrow)" />
  <line x1="640" y1="118" x2="640" y2="132" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#derive-arrow)" />

  <!-- Output 1: Secondary Text -->
  <g transform="translate(30, 136)">
    <rect x="0" y="0" width="220" height="96" rx="6" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />
    <text x="110" y="26" fill="#ffffff" font-size="14" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">Secondary Text</text>
    <text x="110" y="48" fill="#38bdf8" font-size="12" font-weight="600" font-family="JetBrains Mono, monospace" text-anchor="middle">Muted shades of text</text>
    <text x="110" y="74" fill="#a1a1aa" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Body copy, subtitles, kickers</text>
  </g>

  <!-- Output 2: Container Backgrounds -->
  <g transform="translate(280, 136)">
    <rect x="0" y="0" width="220" height="96" rx="6" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />
    <text x="110" y="26" fill="#ffffff" font-size="14" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">Container Fills</text>
    <text x="110" y="48" fill="#38bdf8" font-size="12" font-weight="600" font-family="JetBrains Mono, monospace" text-anchor="middle">Glass tint over background</text>
    <text x="110" y="74" fill="#a1a1aa" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Cards, terminals, code blocks</text>
  </g>

  <!-- Output 3: Borders & Outlines -->
  <g transform="translate(530, 136)">
    <rect x="0" y="0" width="220" height="96" rx="6" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />
    <text x="110" y="26" fill="#ffffff" font-size="14" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">Borders &amp; Outlines</text>
    <text x="110" y="48" fill="#38bdf8" font-size="12" font-weight="600" font-family="JetBrains Mono, monospace" text-anchor="middle">Subtle outlines from text</text>
    <text x="110" y="74" fill="#a1a1aa" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Card borders, table dividers</text>
  </g>
</svg>
