<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="StageRoutine Element Anchors" viewBox="0 0 780 215" width="100%">
  <title>StageRoutine Element Anchors</title>

  <!-- Outer frame -->
  <rect x="20" y="15" width="740" height="185" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />

  <!-- Column dividers -->
  <line x1="266.5" y1="25" x2="266.5" y2="190" stroke="rgba(255, 255, 255, 0.06)" />
  <line x1="513.5" y1="25" x2="513.5" y2="190" stroke="rgba(255, 255, 255, 0.06)" />

  <!-- 1. anchor: "top-left" -->
  <g>
    <text x="143" y="42" fill="#38bdf8" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace" text-anchor="middle">anchor: "top-left"</text>

    <!-- Element box -->
    <rect x="95" y="70" width="115" height="52" rx="6" fill="rgba(56, 189, 248, 0.08)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="152" y="101" fill="#ffffff" font-size="11" font-weight="600" font-family="JetBrains Mono, monospace" text-anchor="middle">Element</text>

    <!-- (x, y) target crosshairs and pin -->
    <line x1="65" y1="70" x2="135" y2="70" stroke="#f43f5e" stroke-width="1" stroke-dasharray="3 3" opacity="0.7" />
    <line x1="95" y1="50" x2="95" y2="110" stroke="#f43f5e" stroke-width="1" stroke-dasharray="3 3" opacity="0.7" />
    <circle cx="95" cy="70" r="4.5" fill="#f43f5e" stroke="#09090b" stroke-width="1.5" />
    <text x="88" y="64" fill="#f43f5e" font-size="10" font-weight="700" font-family="JetBrains Mono, monospace" text-anchor="end">(x, y)</text>

    <!-- Explanations -->
    <text x="143" y="152" fill="#ffffff" font-size="11" font-weight="500" font-family="system-ui, sans-serif" text-anchor="middle">Top-left corner aligns to (x, y)</text>
    <text x="143" y="168" fill="#71717a" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Default: all elements</text>
  </g>

  <!-- 2. anchor: "center" -->
  <g>
    <text x="390" y="42" fill="#38bdf8" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace" text-anchor="middle">anchor: "center"</text>

    <!-- Element box -->
    <rect x="332" y="70" width="115" height="52" rx="6" fill="rgba(56, 189, 248, 0.08)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="390" y="101" fill="#ffffff" font-size="11" font-weight="600" font-family="JetBrains Mono, monospace" text-anchor="middle">Element</text>

    <!-- (x, y) target crosshairs and pin -->
    <line x1="300" y1="96" x2="480" y2="96" stroke="#f43f5e" stroke-width="1" stroke-dasharray="3 3" opacity="0.7" />
    <line x1="390" y1="52" x2="390" y2="140" stroke="#f43f5e" stroke-width="1" stroke-dasharray="3 3" opacity="0.7" />
    <circle cx="390" cy="96" r="4.5" fill="#f43f5e" stroke="#09090b" stroke-width="1.5" />
    <text x="390" y="86" fill="#f43f5e" font-size="10" font-weight="700" font-family="JetBrains Mono, monospace" text-anchor="middle">(x, y)</text>

    <!-- Explanations -->
    <text x="390" y="152" fill="#ffffff" font-size="11" font-weight="500" font-family="system-ui, sans-serif" text-anchor="middle">Exact center aligns to (x, y)</text>
    <text x="390" y="168" fill="#71717a" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Typical: Title, badges, shapes</text>
  </g>

  <!-- 3. anchor: "bottom" -->
  <g>
    <text x="637" y="42" fill="#38bdf8" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace" text-anchor="middle">anchor: "bottom"</text>

    <!-- Element box -->
    <rect x="580" y="70" width="115" height="52" rx="6" fill="rgba(56, 189, 248, 0.08)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="637" y="101" fill="#ffffff" font-size="11" font-weight="600" font-family="JetBrains Mono, monospace" text-anchor="middle">Element</text>

    <!-- (x, y) target crosshairs and pin -->
    <line x1="550" y1="122" x2="724" y2="122" stroke="#f43f5e" stroke-width="1" stroke-dasharray="3 3" opacity="0.7" />
    <line x1="637" y1="80" x2="637" y2="145" stroke="#f43f5e" stroke-width="1" stroke-dasharray="3 3" opacity="0.7" />
    <circle cx="637" cy="122" r="4.5" fill="#f43f5e" stroke="#09090b" stroke-width="1.5" />
    <text x="637" y="140" fill="#f43f5e" font-size="10" font-weight="700" font-family="JetBrains Mono, monospace" text-anchor="middle">(x, y)</text>

    <!-- Explanations -->
    <text x="637" y="152" fill="#ffffff" font-size="11" font-weight="500" font-family="system-ui, sans-serif" text-anchor="middle">Bottom edge aligns to (x, y)</text>
    <text x="637" y="168" fill="#71717a" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Typical: Slide footers, bottom bars</text>
  </g>
</svg>
