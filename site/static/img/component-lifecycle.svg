<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="StageRoutine Component Lifecycle" viewBox="0 0 720 160" width="100%">
  <title>StageRoutine Component Lifecycle</title>

  <defs>
    <marker id="lc-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="lc-arrow-muted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="rgba(255, 255, 255, 0.35)" />
    </marker>
  </defs>

  <!-- 1. Mounted -->
  <g transform="translate(12, 15)">
    <rect x="0" y="0" width="152" height="130" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />
    <text x="76" y="36" fill="#ffffff" font-size="17" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">Mounted</text>
    <rect x="18" y="48" width="116" height="26" rx="5" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />
    <text x="76" y="66" fill="#38bdf8" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace" text-anchor="middle">onMount()</text>
    <text x="76" y="98" fill="#a1a1aa" font-size="13" font-weight="500" font-family="system-ui, sans-serif" text-anchor="middle">DOM Attached</text>
    <text x="76" y="116" fill="#71717a" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">(runs once)</text>
  </g>

  <!-- Arrow: Mounted -> Activated -->
  <line x1="170" y1="80" x2="196" y2="80" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#lc-arrow)" />

  <!-- 2. Activated (Highlighted State) -->
  <g transform="translate(202, 15)">
    <rect x="0" y="0" width="152" height="130" rx="8" fill="rgba(56, 189, 248, 0.05)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="76" y="36" fill="#ffffff" font-size="17" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">Activated</text>
    <rect x="16" y="48" width="120" height="26" rx="5" fill="rgba(56, 189, 248, 0.25)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="76" y="66" fill="#38bdf8" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace" text-anchor="middle">onActivate()</text>
    <text x="76" y="98" fill="#38bdf8" font-size="13" font-weight="600" font-family="JetBrains Mono, monospace" text-anchor="middle">opacity &gt; 0</text>
    <text x="76" y="116" fill="#e0f2fe" font-size="12" font-weight="500" font-family="system-ui, sans-serif" text-anchor="middle">Start render loop</text>
  </g>

  <!-- Dual Transition Arrows: Activated <-> Deactivated -->
  <g>
    <line x1="360" y1="65" x2="386" y2="65" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.5" marker-end="url(#lc-arrow-muted)" />
    <line x1="386" y1="95" x2="360" y2="95" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#lc-arrow)" />
  </g>

  <!-- 3. Deactivated -->
  <g transform="translate(392, 15)">
    <rect x="0" y="0" width="152" height="130" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />
    <text x="76" y="36" fill="#ffffff" font-size="17" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">Deactivated</text>
    <rect x="10" y="48" width="132" height="26" rx="5" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.2" />
    <text x="76" y="66" fill="#a1a1aa" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace" text-anchor="middle">onDeactivate()</text>
    <text x="76" y="98" fill="#a1a1aa" font-size="13" font-weight="600" font-family="JetBrains Mono, monospace" text-anchor="middle">opacity === 0</text>
    <text x="76" y="116" fill="#a1a1aa" font-size="12" font-weight="500" font-family="system-ui, sans-serif" text-anchor="middle">Pause render loop</text>
  </g>

  <!-- Arrow: Deactivated -> Unmounted -->
  <line x1="550" y1="80" x2="576" y2="80" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.5" marker-end="url(#lc-arrow-muted)" />

  <!-- 4. Unmounted -->
  <g transform="translate(582, 15)">
    <rect x="0" y="0" width="126" height="130" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />
    <text x="63" y="36" fill="#ffffff" font-size="17" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">Unmounted</text>
    <rect x="10" y="48" width="106" height="26" rx="5" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.2" />
    <text x="63" y="66" fill="#a1a1aa" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace" text-anchor="middle">onUnmount()</text>
    <text x="63" y="98" fill="#a1a1aa" font-size="13" font-weight="500" font-family="system-ui, sans-serif" text-anchor="middle">Stage destroyed</text>
    <text x="63" y="116" fill="#71717a" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Cleanup listeners</text>
  </g>
</svg>
