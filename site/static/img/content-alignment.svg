<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="StageRoutine Content Alignment" viewBox="0 0 780 440" width="100%">
  <title>StageRoutine Content Alignment</title>

  <!-- Title & Subtitle -->
  <text x="25" y="32" fill="#ffffff" font-size="16" font-weight="700" font-family="system-ui, sans-serif">Content Alignment</text>
  <text x="185" y="32" fill="#a1a1aa" font-size="13" font-weight="500" font-family="system-ui, sans-serif">— 9-position alignment grid for container children &amp; text</text>

  <!-- Column Headers -->
  <text x="200" y="58" fill="#e4e4e7" font-size="14" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">Left</text>
  <text x="420" y="58" fill="#e4e4e7" font-size="14" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">Center</text>
  <text x="640" y="58" fill="#e4e4e7" font-size="14" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">Right</text>

  <!-- Row Headers -->
  <text x="75" y="127" fill="#e4e4e7" font-size="14" font-weight="700" font-family="system-ui, sans-serif" text-anchor="end">Top</text>
  <text x="75" y="232" fill="#e4e4e7" font-size="14" font-weight="700" font-family="system-ui, sans-serif" text-anchor="end">Middle</text>
  <text x="75" y="337" fill="#e4e4e7" font-size="14" font-weight="700" font-family="system-ui, sans-serif" text-anchor="end">Bottom</text>

  <!-- Container Box (Card / Shape) -->
  <rect x="90" y="70" width="660" height="315" rx="10" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5" />

  <!-- Grid division lines -->
  <line x1="310" y1="70" x2="310" y2="385" stroke="rgba(255, 255, 255, 0.08)" stroke-dasharray="4 4" stroke-width="1.2" />
  <line x1="530" y1="70" x2="530" y2="385" stroke="rgba(255, 255, 255, 0.08)" stroke-dasharray="4 4" stroke-width="1.2" />
  <line x1="90" y1="175" x2="750" y2="175" stroke="rgba(255, 255, 255, 0.08)" stroke-dasharray="4 4" stroke-width="1.2" />
  <line x1="90" y1="280" x2="750" y2="280" stroke="rgba(255, 255, 255, 0.08)" stroke-dasharray="4 4" stroke-width="1.2" />

  <!-- ==================== ROW 1: TOP ==================== -->

  <!-- Top-Left -->
  <g>
    <rect x="104" y="84" width="124" height="36" rx="6" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="166" y="107" fill="#ffffff" font-size="15" font-weight="700" font-family="JetBrains Mono, monospace" text-anchor="middle">"top-left"</text>
  </g>

  <!-- Top (Center) -->
  <g>
    <rect x="380" y="84" width="80" height="36" rx="6" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="420" y="107" fill="#ffffff" font-size="15" font-weight="700" font-family="JetBrains Mono, monospace" text-anchor="middle">"top"</text>
  </g>

  <!-- Top-Right -->
  <g>
    <rect x="602" y="84" width="134" height="36" rx="6" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="669" y="107" fill="#ffffff" font-size="15" font-weight="700" font-family="JetBrains Mono, monospace" text-anchor="middle">"top-right"</text>
  </g>

  <!-- ==================== ROW 2: MIDDLE ==================== -->

  <!-- Middle-Left ("left") -->
  <g>
    <rect x="104" y="209" width="88" height="36" rx="6" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="148" y="232" fill="#ffffff" font-size="15" font-weight="700" font-family="JetBrains Mono, monospace" text-anchor="middle">"left"</text>
  </g>

  <!-- Middle-Center ("center" - Default) -->
  <g>
    <rect x="330" y="198" width="180" height="58" rx="8" fill="rgba(56, 189, 248, 0.14)" stroke="#38bdf8" stroke-width="1.8" />
    <text x="420" y="224" fill="#ffffff" font-size="16" font-weight="700" font-family="JetBrains Mono, monospace" text-anchor="middle">"center"</text>
    <text x="420" y="244" fill="#38bdf8" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">default for containers</text>
  </g>

  <!-- Middle-Right ("right") -->
  <g>
    <rect x="640" y="209" width="96" height="36" rx="6" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="688" y="232" fill="#ffffff" font-size="15" font-weight="700" font-family="JetBrains Mono, monospace" text-anchor="middle">"right"</text>
  </g>

  <!-- ==================== ROW 3: BOTTOM ==================== -->

  <!-- Bottom-Left -->
  <g>
    <rect x="104" y="335" width="148" height="36" rx="6" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="178" y="358" fill="#ffffff" font-size="15" font-weight="700" font-family="JetBrains Mono, monospace" text-anchor="middle">"bottom-left"</text>
  </g>

  <!-- Bottom (Center) -->
  <g>
    <rect x="368" y="335" width="104" height="36" rx="6" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="420" y="358" fill="#ffffff" font-size="15" font-weight="700" font-family="JetBrains Mono, monospace" text-anchor="middle">"bottom"</text>
  </g>

  <!-- Bottom-Right -->
  <g>
    <rect x="578" y="335" width="158" height="36" rx="6" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="657" y="358" fill="#ffffff" font-size="15" font-weight="700" font-family="JetBrains Mono, monospace" text-anchor="middle">"bottom-right"</text>
  </g>

  <!-- Footer Note -->
  <text x="420" y="418" fill="#a1a1aa" font-size="13" font-family="system-ui, sans-serif" text-anchor="middle">Single-axis shorthands center along the opposite axis: <tspan fill="#38bdf8" font-family="JetBrains Mono, monospace" font-weight="700">"top"</tspan>, <tspan fill="#38bdf8" font-family="JetBrains Mono, monospace" font-weight="700">"bottom"</tspan>, <tspan fill="#38bdf8" font-family="JetBrains Mono, monospace" font-weight="700">"left"</tspan>, and <tspan fill="#38bdf8" font-family="JetBrains Mono, monospace" font-weight="700">"right"</tspan></text>
</svg>
