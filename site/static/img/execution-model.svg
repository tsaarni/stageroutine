<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="StageRoutine Two-Phase Execution Model" viewBox="0 0 780 310" width="100%">
  <title>StageRoutine Two-Phase Execution Model</title>

  <defs>
    <marker id="exec-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Phase 1: Recording -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="340" height="270" rx="8" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />
    <text x="20" y="34" fill="#ffffff" font-size="17" font-weight="700" font-family="system-ui, sans-serif">1. Recording Phase</text>
    <text x="20" y="54" fill="#38bdf8" font-size="13" font-weight="600" font-family="JetBrains Mono, monospace">Instant script run on load</text>

    <!-- Step A: Script -->
    <g transform="translate(20, 75)">
      <rect x="0" y="0" width="300" height="44" rx="6" fill="rgba(56, 189, 248, 0.05)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
      <text x="150" y="27" fill="#ffffff" font-size="14" font-weight="600" font-family="JetBrains Mono, monospace" text-anchor="middle">title.x = to(80)</text>
    </g>

    <line x1="170" y1="120" x2="170" y2="138" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#exec-arrow)" />

    <!-- Step B: Reactive Proxy -->
    <g transform="translate(20, 142)">
      <rect x="0" y="0" width="300" height="44" rx="6" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />
      <text x="150" y="27" fill="#ffffff" font-size="14" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">ES6 Proxy Traps Mutation</text>
    </g>

    <line x1="170" y1="187" x2="170" y2="204" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#exec-arrow)" />

    <!-- Step C: Stage Pause -->
    <g transform="translate(20, 208)">
      <rect x="0" y="0" width="300" height="44" rx="6" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />
      <text x="150" y="27" fill="#38bdf8" font-size="14" font-weight="600" font-family="JetBrains Mono, monospace" text-anchor="middle">stage.pause() → Step &amp; Snapshot</text>
    </g>
  </g>

  <!-- Phase Transition Arrow -->
  <line x1="375" y1="155" x2="405" y2="155" stroke="#38bdf8" stroke-width="2" marker-end="url(#exec-arrow)" />

  <!-- Phase 2: Playback -->
  <g transform="translate(420, 20)">
    <rect x="0" y="0" width="340" height="270" rx="8" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />
    <text x="20" y="34" fill="#ffffff" font-size="17" font-weight="700" font-family="system-ui, sans-serif">2. Playback Phase</text>
    <text x="20" y="54" fill="#38bdf8" font-size="13" font-weight="600" font-family="JetBrains Mono, monospace">Interactive presenter runtime</text>

    <!-- Step A: Viewport & Mount -->
    <g transform="translate(20, 75)">
      <rect x="0" y="0" width="300" height="44" rx="6" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />
      <text x="150" y="27" fill="#ffffff" font-size="14" font-weight="600" font-family="JetBrains Mono, monospace" text-anchor="middle">stage.mount("#stage")</text>
    </g>

    <line x1="170" y1="120" x2="170" y2="138" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#exec-arrow)" />

    <!-- Step B: User Next -->
    <g transform="translate(20, 142)">
      <rect x="0" y="0" width="300" height="44" rx="6" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />
      <text x="150" y="27" fill="#ffffff" font-size="14" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">User Press [Next] / [Space]</text>
    </g>

    <line x1="170" y1="187" x2="170" y2="204" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#exec-arrow)" />

    <!-- Step C: Animation Loop -->
    <g transform="translate(20, 208)">
      <rect x="0" y="0" width="300" height="44" rx="6" fill="rgba(56, 189, 248, 0.05)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
      <text x="150" y="27" fill="#38bdf8" font-size="14" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Animation Loop → GPU Styles</text>
    </g>
  </g>
</svg>
