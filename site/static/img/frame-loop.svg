<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="StageRoutine Frame Animation Loop" viewBox="0 0 780 150" width="100%">
  <title>StageRoutine Frame Animation Loop</title>

  <defs>
    <marker id="anim-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- 1. Elapsed Time -->
  <g transform="translate(10, 30)">
    <rect x="0" y="0" width="155" height="80" rx="8" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />
    <text x="77" y="35" fill="#ffffff" font-size="15" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">1. Frame Tick</text>
    <text x="77" y="58" fill="#38bdf8" font-size="12" font-weight="600" font-family="JetBrains Mono, monospace" text-anchor="middle">elapsed / duration</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="172" y1="70" x2="194" y2="70" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#anim-arrow)" />

  <!-- 2. Easing Curve -->
  <g transform="translate(200, 30)">
    <rect x="0" y="0" width="155" height="80" rx="8" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />
    <text x="77" y="35" fill="#ffffff" font-size="15" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">2. Easing Curve</text>
    <text x="77" y="58" fill="#38bdf8" font-size="12" font-weight="600" font-family="JetBrains Mono, monospace" text-anchor="middle">curve(progress)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="362" y1="70" x2="384" y2="70" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#anim-arrow)" />

  <!-- 3. Interpolation -->
  <g transform="translate(390, 30)">
    <rect x="0" y="0" width="165" height="80" rx="8" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />
    <text x="82" y="35" fill="#ffffff" font-size="15" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">3. Interpolation</text>
    <text x="82" y="58" fill="#38bdf8" font-size="12" font-weight="600" font-family="JetBrains Mono, monospace" text-anchor="middle">interpolateValue()</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="562" y1="70" x2="584" y2="70" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#anim-arrow)" />

  <!-- 4. DOM Style Write -->
  <g transform="translate(590, 30)">
    <rect x="0" y="0" width="180" height="80" rx="8" fill="rgba(56, 189, 248, 0.05)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="90" y="35" fill="#ffffff" font-size="15" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">4. DOM Style Write</text>
    <text x="90" y="58" fill="#38bdf8" font-size="12" font-weight="600" font-family="JetBrains Mono, monospace" text-anchor="middle">node.style.transform</text>
  </g>
</svg>
