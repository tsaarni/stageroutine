<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="StageRoutine Concepts: Stage, Scenes, Steps, and Elements" viewBox="0 0 780 280" width="100%">
  <title>StageRoutine Concepts</title>

  <!-- 1. STAGE Outer Container -->
  <rect x="10" y="10" width="760" height="260" rx="10" fill="rgba(56, 189, 248, 0.02)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />
  <text x="30" y="38" fill="#ffffff" font-size="15" font-weight="700" font-family="system-ui, sans-serif">Stage</text>
  <text x="80" y="38" fill="#a1a1aa" font-size="13" font-weight="500" font-family="system-ui, sans-serif">— The virtual canvas &amp; director</text>

  <!-- 2. SCENES -->
  <!-- Scene 1 -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="340" height="190" rx="8" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <text x="20" y="30" fill="#38bdf8" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">Scene 1: "Intro"</text>

    <!-- Steps inside Scene 1 -->
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="145" height="125" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
      <text x="12" y="24" fill="#ffffff" font-size="13" font-weight="600" font-family="system-ui, sans-serif">Step 1</text>
      <text x="12" y="42" fill="#a1a1aa" font-size="11" font-weight="500" font-family="JetBrains Mono, monospace">stage.pause()</text>

      <!-- Elements in Step 1 -->
      <rect x="10" y="55" width="125" height="28" rx="4" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <text x="72" y="74" fill="#38bdf8" font-size="12" font-weight="600" font-family="JetBrains Mono, monospace" text-anchor="middle">Title</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(175, 45)">
      <rect x="0" y="0" width="150" height="125" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
      <text x="12" y="24" fill="#ffffff" font-size="13" font-weight="600" font-family="system-ui, sans-serif">Step 2</text>
      <text x="12" y="42" fill="#a1a1aa" font-size="11" font-weight="500" font-family="JetBrains Mono, monospace">stage.pause()</text>

      <!-- Elements in Step 2 -->
      <rect x="10" y="55" width="130" height="28" rx="4" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <text x="75" y="74" fill="#38bdf8" font-size="12" font-weight="600" font-family="JetBrains Mono, monospace" text-anchor="middle">Title (moved)</text>

      <rect x="10" y="88" width="130" height="28" rx="4" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1" />
      <text x="75" y="107" fill="#ffffff" font-size="12" font-weight="600" font-family="JetBrains Mono, monospace" text-anchor="middle">CodeBlock</text>
    </g>
  </g>

  <!-- Scene 2 -->
  <g transform="translate(400, 60)">
    <rect x="0" y="0" width="345" height="190" rx="8" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />
    <text x="20" y="30" fill="#ffffff" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">Scene 2: "Architecture"</text>

    <!-- Step 3 -->
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="315" height="125" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
      <text x="15" y="24" fill="#ffffff" font-size="13" font-weight="600" font-family="system-ui, sans-serif">Step 3</text>
      <text x="15" y="42" fill="#a1a1aa" font-size="11" font-weight="500" font-family="JetBrains Mono, monospace">stage.pause()</text>

      <rect x="15" y="60" width="285" height="45" rx="4" fill="rgba(56, 189, 248, 0.08)" stroke="#38bdf8" stroke-width="1" />
      <text x="157" y="88" fill="#38bdf8" font-size="13" font-weight="600" font-family="JetBrains Mono, monospace" text-anchor="middle">SequenceDiagram</text>
    </g>
  </g>
</svg>
