<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Milestone Synchronization Timeline" viewBox="0 0 780 270" width="100%">
  <title>Milestone Synchronization Timeline</title>

  <defs>
    <marker id="timeline-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Timeline Grid Background Ruler -->
  <!-- 0.0s Guide -->
  <line x1="220" y1="35" x2="220" y2="250" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
  <text x="220" y="25" fill="#a1a1aa" font-size="13" font-weight="600" font-family="JetBrains Mono, monospace" text-anchor="middle">0.0s</text>

  <!-- 0.5s Guide -->
  <line x1="390" y1="35" x2="390" y2="250" stroke="rgba(56, 189, 248, 0.25)" stroke-dasharray="4 4" stroke-width="1.5" />
  <text x="390" y="25" fill="#38bdf8" font-size="13" font-weight="700" font-family="JetBrains Mono, monospace" text-anchor="middle">0.5s ("halfway")</text>

  <!-- 1.0s Guide -->
  <line x1="560" y1="35" x2="560" y2="250" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
  <text x="560" y="25" fill="#a1a1aa" font-size="13" font-weight="600" font-family="JetBrains Mono, monospace" text-anchor="middle">1.0s ("end")</text>

  <!-- 1.1s Guide -->
  <line x1="594" y1="35" x2="594" y2="250" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
  <text x="625" y="25" fill="#a1a1aa" font-size="13" font-weight="600" font-family="JetBrains Mono, monospace" text-anchor="middle">1.1s</text>

  <!-- Track 1: title.opacity -->
  <g transform="translate(0, 50)">
    <text x="200" y="36" fill="#ffffff" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace" text-anchor="end">title.opacity</text>

    <!-- Bar 0.0s -> 1.0s (width: 340px) -->
    <rect x="220" y="10" width="340" height="44" rx="6" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5" />
    <text x="290" y="37" fill="#ffffff" font-size="13" font-weight="600" font-family="system-ui, sans-serif">1.0s Duration</text>

    <!-- Halfway Milestone Marker -->
    <circle cx="390" cy="32" r="6" fill="#38bdf8" />
  </g>

  <!-- Trigger Arrow from Halfway down to Track 2 -->
  <path d="M 390 92 L 390 150" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#timeline-arrow)" />
  <text x="400" y="125" fill="#38bdf8" font-size="12" font-weight="600" font-family="JetBrains Mono, monospace">triggers start</text>

  <!-- Track 2: code.opacity -->
  <g transform="translate(0, 160)">
    <text x="200" y="36" fill="#38bdf8" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace" text-anchor="end">code.opacity</text>

    <!-- Bar 0.5s -> 1.1s (starts at x=390, width=204px for 0.6s) -->
    <rect x="390" y="10" width="204" height="44" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="492" y="37" fill="#38bdf8" font-size="13" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">0.6s Duration</text>
  </g>
</svg>
