<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" color="#ffffff">
  <title>StageRoutine Logo</title>
  <style>
    :root { color: #ffffff; }
    @media (prefers-color-scheme: light) {
      :root { color: #09090b; }
    }
  </style>

  <!-- Left Bracket: 48px stroke, sharp corners, butt caps, miter joins -->
  <path class="sr-logo-bracket" d="M 142 116 h -20 a 36 36 0 0 0 -36 36 v 50 a 54 54 0 0 1 -54 54 a 54 54 0 0 1 54 54 v 50 a 36 36 0 0 0 36 36 h 20"
        fill="none" stroke="currentColor" stroke-width="48" stroke-linecap="butt" stroke-linejoin="miter" />

  <!-- Playhead Triangle -->
  <polygon class="sr-logo-playhead" points="192,175 332,256 192,337" fill="currentColor" />

  <!-- Right Bracket: 48px stroke, sharp corners, butt caps, miter joins -->
  <path class="sr-logo-bracket" d="M 370 116 h 20 a 36 36 0 0 1 36 36 v 50 a 54 54 0 0 0 54 54 a 54 54 0 0 0 -54 54 v 50 a 36 36 0 0 1 -36 36 h -20"
        fill="none" stroke="currentColor" stroke-width="48" stroke-linecap="butt" stroke-linejoin="miter" />
</svg>
