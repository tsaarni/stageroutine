<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Virtual Viewport and Responsive Stage Scaling" viewBox="0 0 780 340" width="100%">
  <title>Virtual Viewport and Responsive Stage Scaling</title>

  <!-- 1. Outer Screen / Browser Window -->
  <rect x="15" y="15" width="750" height="310" rx="10" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" stroke-dasharray="5 5" />
  <text x="35" y="42" fill="#a1a1aa" font-size="14" font-weight="600" font-family="system-ui, sans-serif">Browser Window (Any Display Size / Aspect Ratio)</text>

  <!-- 2. Scaled Virtual 16:9 Canvas -->
  <rect x="120" y="65" width="540" height="240" rx="8" fill="rgba(56, 189, 248, 0.04)" stroke="#38bdf8" stroke-width="2" />

  <!-- Canvas Header -->
  <text x="140" y="95" fill="#ffffff" font-size="15" font-weight="700" font-family="system-ui, sans-serif">Virtual Viewport (1920 × 1080)</text>
  <text x="640" y="95" fill="#38bdf8" font-size="13" font-weight="600" font-family="JetBrains Mono, monospace" text-anchor="end">transform: scale(...)</text>

  <!-- Coordinates corner badges -->
  <text x="140" y="125" fill="#71717a" font-size="12" font-weight="600" font-family="JetBrains Mono, monospace">(0, 0)</text>
  <text x="640" y="125" fill="#71717a" font-size="12" font-weight="600" font-family="JetBrains Mono, monospace" text-anchor="end">(100, 0)</text>
  <text x="140" y="285" fill="#71717a" font-size="12" font-weight="600" font-family="JetBrains Mono, monospace">(0, 100)</text>
  <text x="640" y="285" fill="#71717a" font-size="12" font-weight="600" font-family="JetBrains Mono, monospace" text-anchor="end">(100, 100)</text>

  <!-- 3. Component inside canvas: Title -->
  <g transform="translate(230, 140)">
    <rect x="0" y="0" width="320" height="76" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="#ffffff" stroke-width="1.5" />
    <text x="160" y="34" fill="#ffffff" font-size="15" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">Title("StageRoutine")</text>
    <text x="160" y="58" fill="#38bdf8" font-size="13" font-weight="600" font-family="JetBrains Mono, monospace" text-anchor="middle">x: "center", y: 40</text>
  </g>
</svg>
