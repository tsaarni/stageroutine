<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Presenter Console — Reactive Slides</title>
    <link rel="stylesheet" href="/src/presenter/presenter.css" />
  </head>
  <body>
    <!-- Top Scene Progress Bar -->
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>

    <!-- M3 Header -->
    <header>
      <div class="header-left">
        <div class="app-brand">
          <span class="material-symbols-outlined">slideshow</span>
          <span>Presenter View</span>
        </div>
        <!-- Scene Dropdown Jump Menu -->
        <div class="m3-dropdown-container">
          <button class="m3-chip scene-dropdown-btn" id="scene-badge" title="Jump to Scene">
            <span class="material-symbols-outlined" style="font-size: 16px;">format_list_numbered</span>
            <span id="scene-text">Scene 1 of 1</span>
            <span class="material-symbols-outlined dropdown-arrow">arrow_drop_down</span>
          </button>
          <div class="m3-dropdown-menu" id="scene-menu"></div>
        </div>
      </div>

      <div class="header-right" id="header-right">
        <!-- Unified Record Pill with Embedded Mic Control -->
        <div class="record-pill" id="record-pill">
          <button class="record-main-btn" id="btn-record" title="Record Presentation directly via GPU (Key: Alt+R)">
            <span class="rec-dot" id="rec-dot"></span>
            <span id="rec-label">Record</span>
          </button>
          <span class="record-divider"></span>
          <button class="record-mic-btn" id="btn-mic" title="Microphone enabled (Click to mute)">
            <span class="material-symbols-outlined" id="mic-icon">mic</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Notes Workspace -->
    <main>
      <div class="notes-card">
        <div class="notes-card-header">
          <div class="notes-label">
            <span class="material-symbols-outlined">sticky_note_2</span>
            <span>Speaker Notes</span>
          </div>
          <div class="font-size-controls">
            <button class="m3-icon-btn" id="btn-font-dec" title="Decrease Font Size">
              <span class="material-symbols-outlined">text_decrease</span>
            </button>
            <button class="m3-icon-btn" id="btn-font-reset" title="Reset Font Size">
              <span class="material-symbols-outlined">restart_alt</span>
            </button>
            <button class="m3-icon-btn" id="btn-font-inc" title="Increase Font Size">
              <span class="material-symbols-outlined">text_increase</span>
            </button>
          </div>
        </div>
        <div class="notes-scroll-body">
          <div class="notes-content" id="current-notes">
            <span class="notes-empty-state">Waiting for presentation scene...</span>
          </div>
        </div>
      </div>
    </main>

    <!-- Bottom Bar: Coming Up Next + Navigation Controls -->
    <footer>
      <div class="next-preview-card">
        <div class="next-preview-header">
          <span class="material-symbols-outlined">upcoming</span>
          <span>Coming Up Next</span>
        </div>
        <div class="next-preview-body">
          <span class="next-scene-title" id="next-scene">-</span>
          <span class="next-notes-snippet" id="next-notes">-</span>
        </div>
      </div>

      <div class="nav-controls">
        <button class="m3-btn m3-btn-tonal" id="btn-prev" title="Go to previous scene (←)">
          <span class="material-symbols-outlined">arrow_back</span>
          <span>Previous</span>
          <span class="kbd">←</span>
        </button>
        <button class="m3-btn m3-btn-filled" id="btn-next" title="Advance to next scene (Space or →)">
          <span>Next</span>
          <span class="material-symbols-outlined">arrow_forward</span>
          <span class="kbd">Space</span>
        </button>
      </div>
    </footer>

    <script type="module" src="/src/presenter/presenter.tsx"></script>
  </body>
</html>
