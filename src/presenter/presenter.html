<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Presenter Console — Reactive Slides</title>
    <!-- Google Fonts: Roboto, Roboto Mono & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&family=Roboto:wght@300;400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Material Design 3 Dark Theme Palette */
        --md-sys-color-background: #0f131a;
        --md-sys-color-surface: #0f131a;
        --md-sys-color-surface-dim: #0b0e14;
        --md-sys-color-surface-container-lowest: #080b0f;
        --md-sys-color-surface-container-low: #151921;
        --md-sys-color-surface-container: #1b202a;
        --md-sys-color-surface-container-high: #242a37;
        --md-sys-color-surface-container-highest: #2e3545;

        --md-sys-color-primary: #a8c7fa;
        --md-sys-color-on-primary: #042e6f;
        --md-sys-color-primary-container: #0842a0;
        --md-sys-color-on-primary-container: #d3e3fd;

        --md-sys-color-secondary: #bec6dc;
        --md-sys-color-on-secondary: #283141;
        --md-sys-color-secondary-container: #394254;
        --md-sys-color-on-secondary-container: #dae2f9;

        --md-sys-color-tertiary: #67e8f9;
        --md-sys-color-tertiary-container: #004e59;
        --md-sys-color-on-tertiary-container: #a5f3fc;

        --md-sys-color-error: #f2b8b5;
        --md-sys-color-on-surface: #e2e2e8;
        --md-sys-color-on-surface-variant: #c4c6d0;
        --md-sys-color-outline: #8e919a;
        --md-sys-color-outline-variant: #3a4150;

        --md-sys-color-timer-active: #4ade80;
        --md-sys-color-timer-paused: #fbbf24;

        /* M3 Shape */
        --md-shape-full: 9999px;
        --md-shape-xl: 28px;
        --md-shape-lg: 16px;
        --md-shape-md: 12px;
        --md-shape-sm: 8px;

        /* M3 Transitions */
        --md-motion-easing-standard: cubic-bezier(0.2, 0, 0, 1);
        --md-motion-duration-short: 150ms;
        --md-motion-duration-medium: 250ms;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--md-sys-color-background);
        color: var(--md-sys-color-on-surface);
        font-family: "Roboto", -apple-system, BlinkMacSystemFont, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        user-select: none;
      }

      .material-symbols-outlined {
        font-family: "Material Symbols Outlined";
        font-weight: normal;
        font-style: normal;
        font-size: 20px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        vertical-align: middle;
      }

      /* Progress Bar at very top */
      .progress-bar-container {
        height: 3px;
        width: 100%;
        background-color: var(--md-sys-color-surface-container-high);
        position: relative;
        overflow: hidden;
      }
      .progress-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--md-sys-color-primary), var(--md-sys-color-tertiary));
        width: 0%;
        transition: width var(--md-motion-duration-medium) var(--md-motion-easing-standard);
      }

      /* Top App Bar Header */
      header {
        background-color: var(--md-sys-color-surface-container-low);
        border-bottom: 1px solid var(--md-sys-color-outline-variant);
        padding: 10px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-shrink: 0;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .app-brand {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--md-sys-color-primary);
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.2px;
        margin-right: 4px;
        flex-shrink: 0;
      }
      .app-brand .material-symbols-outlined {
        font-size: 20px;
      }

      /* M3 Chips */
      .m3-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0 12px;
        height: 34px;
        border-radius: var(--md-shape-sm);
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.1px;
      }
      .m3-chip-primary {
        background-color: var(--md-sys-color-surface-container-highest);
        border: 1px solid var(--md-sys-color-outline-variant);
        color: var(--md-sys-color-primary);
      }
      .m3-chip-secondary {
        background-color: var(--md-sys-color-surface-container);
        border: 1px solid transparent;
        color: var(--md-sys-color-on-surface-variant);
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }

      /* Wall Clock */
      .wall-clock {
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: "Roboto Mono", monospace;
        font-size: 13px;
        color: var(--md-sys-color-on-surface-variant);
        background: var(--md-sys-color-surface-container);
        padding: 4px 10px;
        border-radius: var(--md-shape-full);
      }
      .wall-clock .material-symbols-outlined {
        font-size: 15px;
        color: var(--md-sys-color-outline);
      }

      /* Big Presentation Timer Widget */
      .timer-widget {
        display: flex;
        align-items: center;
        background: var(--md-sys-color-surface-container-high);
        border: 1px solid var(--md-sys-color-outline-variant);
        border-radius: var(--md-shape-full);
        padding: 2px 4px 2px 14px;
        gap: 8px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
      }

      .timer-display {
        font-family: "Roboto Mono", monospace;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.5px;
        color: var(--md-sys-color-timer-active);
        min-width: 64px;
        text-align: center;
        transition: color var(--md-motion-duration-short) ease;
      }
      .timer-display.paused {
        color: var(--md-sys-color-timer-paused);
      }

      .timer-actions {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      /* M3 Icon Button */
      .m3-icon-btn {
        background: transparent;
        border: none;
        color: var(--md-sys-color-on-surface);
        width: 30px;
        height: 30px;
        border-radius: var(--md-shape-full);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background-color var(--md-motion-duration-short) ease,
          color var(--md-motion-duration-short) ease,
          transform 100ms ease;
      }
      .m3-icon-btn .material-symbols-outlined {
        font-size: 17px;
      }
      .m3-icon-btn:hover {
        background-color: rgba(255, 255, 255, 0.08);
      }
      .m3-icon-btn:active {
        transform: scale(0.92);
        background-color: rgba(255, 255, 255, 0.14);
      }
      .m3-icon-btn.tonal {
        background-color: var(--md-sys-color-surface-container-highest);
      }
      .m3-icon-btn.tonal:hover {
        background-color: rgba(168, 199, 250, 0.18);
        color: var(--md-sys-color-primary);
      }

      /* Main Stage (Notes Center) */
      main {
        flex: 1;
        padding: 14px 20px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .notes-card {
        flex: 1;
        background-color: var(--md-sys-color-surface-container-low);
        border: 1px solid var(--md-sys-color-outline-variant);
        border-radius: var(--md-shape-lg);
        padding: 20px 24px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        position: relative;
      }

      .notes-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--md-sys-color-surface-container-high);
      }

      .notes-label {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--md-sys-color-primary);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .notes-label .material-symbols-outlined {
        font-size: 16px;
      }

      .font-size-controls {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .notes-scroll-body {
        flex: 1;
        overflow-y: auto;
        padding-right: 12px;
        user-select: text;
      }

      /* Custom Modern Scrollbar */
      .notes-scroll-body::-webkit-scrollbar {
        width: 5px;
      }
      .notes-scroll-body::-webkit-scrollbar-track {
        background: transparent;
      }
      .notes-scroll-body::-webkit-scrollbar-thumb {
        background: var(--md-sys-color-surface-container-highest);
        border-radius: 999px;
      }
      .notes-scroll-body::-webkit-scrollbar-thumb:hover {
        background: var(--md-sys-color-outline);
      }

      .notes-content {
        font-size: 20px;
        line-height: 1.65;
        color: #f8fafc;
        white-space: pre-wrap;
        font-weight: 400;
        letter-spacing: 0.1px;
        transition: font-size var(--md-motion-duration-short) ease;
      }

      .notes-content ul {
        list-style: none;
        padding-left: 0;
      }
      .notes-content li {
        margin-bottom: 12px;
        position: relative;
        padding-left: 22px;
      }
      .notes-content li::before {
        content: "•";
        position: absolute;
        left: 4px;
        color: var(--md-sys-color-primary);
        font-size: 20px;
        line-height: 1.2;
        top: 0px;
      }

      .notes-empty-state {
        color: var(--md-sys-color-outline);
        font-style: italic;
        font-size: 16px;
      }

      /* Bottom Bar: Next Preview & Navigation Controls */
      footer {
        background-color: var(--md-sys-color-surface-container-low);
        border-top: 1px solid var(--md-sys-color-outline-variant);
        padding: 12px 20px;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 16px;
        flex-shrink: 0;
      }

      /* Coming Up Next Card */
      .next-preview-card {
        background-color: var(--md-sys-color-surface-container);
        border: 1px solid var(--md-sys-color-outline-variant);
        border-radius: var(--md-shape-md);
        padding: 8px 14px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
        overflow: hidden;
      }

      .next-preview-header {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--md-sys-color-tertiary);
      }
      .next-preview-header .material-symbols-outlined {
        font-size: 13px;
      }

      .next-preview-body {
        display: flex;
        align-items: baseline;
        gap: 10px;
        min-width: 0;
      }

      .next-scene-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--md-sys-color-on-surface);
        white-space: nowrap;
        flex-shrink: 0;
      }

      .next-notes-snippet {
        font-size: 13px;
        color: var(--md-sys-color-on-surface-variant);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
      }

      /* Navigation Buttons (Material 3 Buttons) */
      .nav-controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .m3-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 0 18px;
        height: 42px;
        border-radius: var(--md-shape-full);
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.1px;
        cursor: pointer;
        border: none;
        outline: none;
        transition: background-color var(--md-motion-duration-short) ease,
          transform 100ms ease, box-shadow var(--md-motion-duration-short) ease;
        text-decoration: none;
      }
      .m3-btn:active {
        transform: scale(0.96);
      }

      /* Tonal Button (Prev) */
      .m3-btn-tonal {
        background-color: var(--md-sys-color-secondary-container);
        color: var(--md-sys-color-on-secondary-container);
        border: 1px solid var(--md-sys-color-outline-variant);
      }
      .m3-btn-tonal:hover {
        background-color: var(--md-sys-color-surface-container-highest);
        color: #ffffff;
      }
      .m3-btn-tonal:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
      }

      /* Filled Primary Button (Next) */
      .m3-btn-filled {
        background-color: var(--md-sys-color-primary);
        color: var(--md-sys-color-on-primary);
        box-shadow: 0 2px 6px rgba(168, 199, 250, 0.25);
      }
      .m3-btn-filled:hover {
        background-color: #c2e7ff;
        box-shadow: 0 3px 10px rgba(168, 199, 250, 0.35);
      }
      .m3-btn-filled:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      /* Keyboard Shortcut Badge */
      .kbd {
        font-family: "Roboto Mono", monospace;
        font-size: 10px;
        font-weight: 500;
        padding: 1px 5px;
        border-radius: 3px;
        background: rgba(0, 0, 0, 0.25);
        color: inherit;
        opacity: 0.85;
      }
      /* Record Button */
      .record-btn {
        height: 34px;
        padding: 0 14px;
        font-size: 13px;
        gap: 7px;
        background-color: var(--md-sys-color-surface-container-high);
        border: 1px solid var(--md-sys-color-outline-variant);
        border-radius: var(--md-shape-full);
        color: var(--md-sys-color-on-surface);
      }
      .record-btn:hover {
        background-color: var(--md-sys-color-surface-container-highest);
        border-color: rgba(239, 68, 68, 0.4);
      }
      .rec-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #ef4444;
        display: inline-block;
        transition: transform 0.2s ease;
      }
      .record-btn.recording {
        background-color: rgba(239, 68, 68, 0.15);
        border-color: rgba(239, 68, 68, 0.6);
        color: #fca5a5;
      }
      .record-btn.recording .rec-dot {
        animation: rec-pulse 1.2s infinite ease-in-out;
      }
      @keyframes rec-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
          box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
        }
        50% {
          transform: scale(1.2);
          opacity: 0.8;
          box-shadow: 0 0 0 6px rgba(239, 68, 68, 0);
        }
      }
      /* Dropdown Menu for Jump to Scene / Step */
      .m3-dropdown-container {
        position: relative;
        display: inline-block;
      }
      .step-dropdown-btn {
        cursor: pointer;
        user-select: none;
        border: 1px solid var(--md-sys-color-outline-variant);
        background-color: var(--md-sys-color-surface-container);
        color: var(--md-sys-color-on-surface-variant);
        transition: background-color var(--md-motion-duration-short) ease,
          border-color var(--md-motion-duration-short) ease;
        white-space: nowrap;
      }
      .step-dropdown-btn:hover {
        background-color: var(--md-sys-color-surface-container-high);
        border-color: var(--md-sys-color-outline);
        color: #ffffff;
      }
      .dropdown-arrow {
        font-size: 18px;
        transition: transform 0.2s ease;
        margin-left: -2px;
      }
      .step-dropdown-btn.open .dropdown-arrow {
        transform: rotate(180deg);
      }
      .m3-dropdown-menu {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        min-width: 260px;
        max-height: 320px;
        overflow-y: auto;
        background-color: var(--md-sys-color-surface-container-high);
        border: 1px solid var(--md-sys-color-outline-variant);
        border-radius: var(--md-shape-md);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
        padding: 6px;
        z-index: 10000;
        display: none;
        flex-direction: column;
        gap: 2px;
      }
      .m3-dropdown-menu.open {
        display: flex;
        animation: menu-pop 150ms var(--md-motion-easing-standard);
      }
      @keyframes menu-pop {
        from {
          opacity: 0;
          transform: translateY(-6px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .m3-dropdown-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-radius: var(--md-shape-sm);
        color: var(--md-sys-color-on-surface);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        border: none;
        background: transparent;
        width: 100%;
        text-align: left;
        transition: background-color 100ms ease;
      }
      .m3-dropdown-item:hover {
        background-color: var(--md-sys-color-surface-container-highest);
      }
      .m3-dropdown-item.active {
        background-color: var(--md-sys-color-primary-container);
        color: var(--md-sys-color-on-primary-container);
        font-weight: 600;
      }
      .dropdown-step-num {
        font-family: "Roboto Mono", monospace;
        font-size: 11px;
        padding: 2px 6px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.25);
        color: var(--md-sys-color-outline);
      }
      .m3-dropdown-item.active .dropdown-step-num {
        background: rgba(0, 0, 0, 0.35);
        color: var(--md-sys-color-primary);
      }
    </style>
  </head>
  <body>
    <!-- Top Step Progress Bar -->
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>

    <!-- M3 Header -->
    <header>
      <div class="header-left">
        <div class="app-brand">
          <span class="material-symbols-outlined">slideshow</span>
          <span>Presenter View</span>
        </div>
        <!-- Step / Scene Dropdown Jump Menu -->
        <div class="m3-dropdown-container">
          <button class="m3-chip step-dropdown-btn" id="step-badge" title="Jump to Scene / Step">
            <span class="material-symbols-outlined" style="font-size: 16px;">format_list_numbered</span>
            <span id="step-text">Step 1 of 1</span>
            <span class="material-symbols-outlined dropdown-arrow">arrow_drop_down</span>
          </button>
          <div class="m3-dropdown-menu" id="step-menu"></div>
        </div>
      </div>

      <div class="header-right">
        <!-- GPU Recorder Control -->
        <button class="m3-btn m3-btn-tonal record-btn" id="btn-record" title="Record Presentation directly via GPU (Key: Alt+R)">
          <span class="rec-dot" id="rec-dot"></span>
          <span id="rec-label">Record</span>
        </button>

        <!-- Wall Clock -->
        <div class="wall-clock" title="Current Local Time">
          <span class="material-symbols-outlined">schedule</span>
          <span id="wall-clock">--:--:--</span>
        </div>

        <!-- Big Presentation Timer Widget -->
        <div class="timer-widget">
          <div class="timer-display" id="timer" title="Elapsed Presentation Timer">00:00</div>
          <div class="timer-actions">
            <button class="m3-icon-btn tonal" id="btn-timer-toggle" title="Pause / Resume Timer (Key: P)">
              <span class="material-symbols-outlined" id="timer-toggle-icon">pause</span>
            </button>
            <button class="m3-icon-btn tonal" id="btn-timer-reset" title="Reset Timer (Key: R)">
              <span class="material-symbols-outlined">replay</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Notes Workspace -->
    <main>
      <div class="notes-card">
        <div class="notes-card-header">
          <div class="notes-label">
            <span class="material-symbols-outlined">sticky_note_2</span>
            <span>Current Speaker Notes</span>
          </div>
          <div class="font-size-controls">
            <button class="m3-icon-btn" id="btn-font-dec" title="Decrease Font Size">
              <span class="material-symbols-outlined">text_decrease</span>
            </button>
            <button class="m3-icon-btn" id="btn-font-inc" title="Increase Font Size">
              <span class="material-symbols-outlined">text_increase</span>
            </button>
          </div>
        </div>
        <div class="notes-scroll-body">
          <div class="notes-content" id="current-notes">
            <span class="notes-empty-state">Waiting for presentation state...</span>
          </div>
        </div>
      </div>
    </main>

    <!-- Bottom Bar: Coming Up Next + Navigation Controls -->
    <footer>
      <div class="next-preview-card">
        <div class="next-preview-header">
          <span class="material-symbols-outlined">upcoming</span>
          <span>Coming Up Next</span>
        </div>
        <div class="next-preview-body">
          <span class="next-scene-title" id="next-scene">-</span>
          <span class="next-notes-snippet" id="next-notes">-</span>
        </div>
      </div>

      <div class="nav-controls">
        <button class="m3-btn m3-btn-tonal" id="btn-prev" title="Go to previous step (←)">
          <span class="material-symbols-outlined">arrow_back</span>
          <span>Previous</span>
          <span class="kbd">←</span>
        </button>
        <button class="m3-btn m3-btn-filled" id="btn-next" title="Advance to next step (Space or →)">
          <span>Next</span>
          <span class="material-symbols-outlined">arrow_forward</span>
          <span class="kbd">Space</span>
        </button>
      </div>
    </footer>

    <script type="module" src="/src/presenter/presenter.ts"></script>
  </body>
</html>
